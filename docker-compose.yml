services:
  ai:
    build: ./services/ai-service
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: telemetry
      PG_USER: telemetry
      PG_PASS: telemetry
      POLL_INTERVAL_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9101:9101"
    restart: unless-stopped

  ingest:
    build:
      context: ./services/ingest-api
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC: telemetry/#
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: telemetry
      PG_USER: telemetry
      PG_PASS: telemetry
      DB_MAX_RETRIES: "5"
      DB_RETRY_BASE_SECONDS: "0.25"
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - telemetry-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - ingest
      - ai
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  telemetry-postgres-data:
