name: Reliability CI

on:
  push:
    branches:
      - main
      - part3-reliability
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ingest-api/requirements.txt
            services/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ingest-api/requirements.txt
          pip install -r services/ai-service/requirements.txt
          pip install pytest==8.3.3

      - name: Run reliability tests
        run: pytest -q

  integration-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for ingest health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs ingest postgres
          exit 1

      - name: Publish the same telemetry packet concurrently
        run: |
          PAYLOAD='{"device_id":"node-ci","seq":42,"ts":1772490151,"temp":60.0,"vibration":0.95}'

          docker compose exec -T mqtt mosquitto_pub -h localhost -t telemetry/node-ci -m "$PAYLOAD" &
          FIRST_PID=$!
          docker compose exec -T mqtt mosquitto_pub -h localhost -t telemetry/node-ci -m "$PAYLOAD" &
          SECOND_PID=$!
          wait "$FIRST_PID" "$SECOND_PID"

          sleep 12

      - name: Verify one durable result per event
        run: |
          TELEMETRY_ROWS=$(docker compose exec -T postgres psql -U telemetry -d telemetry -tAc "SELECT COUNT(*) FROM telemetry_events WHERE device_id='node-ci' AND seq=42;")
          EVALUATION_ROWS=$(docker compose exec -T postgres psql -U telemetry -d telemetry -tAc "SELECT COUNT(*) FROM telemetry_evaluations e JOIN telemetry_events t ON t.id=e.telemetry_event_id WHERE t.device_id='node-ci' AND t.seq=42;")
          INCIDENT_ROWS=$(docker compose exec -T postgres psql -U telemetry -d telemetry -tAc "SELECT COUNT(*) FROM incidents i JOIN telemetry_events t ON t.id=i.telemetry_event_id WHERE t.device_id='node-ci' AND t.seq=42;")

          echo "telemetry_rows=$TELEMETRY_ROWS"
          echo "evaluation_rows=$EVALUATION_ROWS"
          echo "incident_rows=$INCIDENT_ROWS"

          test "$TELEMETRY_ROWS" = "1"
          test "$EVALUATION_ROWS" = "1"
          test "$INCIDENT_ROWS" = "1"

      - name: Verify reliability metrics are visible
        run: |
          curl --fail --silent http://localhost:8000/metrics | grep -E 'telemetry_db_conflicts_total [1-9][0-9]*(\.0)?'
          curl --fail --silent http://localhost:9101/metrics | grep -E 'telemetry_anomaly_evaluations_total 1(\.0)?'
          curl --fail --silent http://localhost:9101/metrics | grep -E 'telemetry_incidents_created_total 1(\.0)?'

      - name: Capture service state
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > reliability-stack.log

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-stack-logs
          path: reliability-stack.log

      - name: Stop stack
        if: always()
        run: docker compose down -v
